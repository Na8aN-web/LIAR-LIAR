<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wanted: True Colors</title>
    <!--
      The CrazyGames upload. The game itself runs on our server
      (https://wantedtruecolors.com/play/crazygames, see CRAZYGAMES.md); this page only shows it,
      full size. The game page loads the CrazyGames SDK itself, which finds the CrazyGames page
      around both frames. CrazyGames' launch parameters (invites: czy_invite and room; instant
      multiplayer: instantJoin) are passed through, because the SDK reads them from the game's URL.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0806;
        overflow: hidden;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe
      id="game"
      title="Wanted: True Colors"
      allow="autoplay; fullscreen; clipboard-write; web-share; gamepad"
      allowfullscreen
    ></iframe>
    <script>
      document.getElementById('game').src = 'https://wantedtruecolors.com/play/crazygames' + location.search;
    </script>
  </body>
</html>
